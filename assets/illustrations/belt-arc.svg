    <filter id="arc-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="2" dy="24" stdDeviation="18" flood-color="#26160e" flood-opacity=".4"/>
    </filter>
    <filter id="arc-grain">
