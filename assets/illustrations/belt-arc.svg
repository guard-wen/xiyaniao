<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="arc-title">
  <title id="arc-title">弧光系列极简方扣 PU 腰带产品示意</title>
  <defs>
    <linearGradient id="arc-leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a16c48"/>
      <stop offset=".44" stop-color="#75462e"/>
      <stop offset="1" stop-color="#3d2419"/>
    </linearGradient>
    <linearGradient id="arc-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bd8960"/>
      <stop offset=".55" stop-color="#6b3f29"/>
      <stop offset="1" stop-color="#2d1b13"/>
    </linearGradient>
    <linearGradient id="arc-steel" x1="0" y1="0" x2="1" y2="1">
